<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Kabuor Dine logo</title>
<style>
  /* Kabuor Dine in the Kabuor family style: KABUOR DINE in capitals (the family's KABUOR, DINE in the family's
     product-name face), with a clean 3D finish. logo.svg and mark.svg are the masters; the PNGs are made from this page. */
  :root { --espresso: #2E211A; --cream: #FBF7F2; --white: #FFFFFF; }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: system-ui, sans-serif; background: #E9E2D9; padding: 40px; display: grid; gap: 28px; width: 1280px; }
  .panel { border-radius: 28px; padding: 64px 72px; display: flex; align-items: center; }
  .ink { background: var(--espresso); }
  .white { background: var(--white); }
  .cream { background: var(--cream); }
  .lockup { display: flex; align-items: center; }
  .lockup img { height: 104px; width: auto; }
  .icons { display: flex; gap: 28px; }
  .icon { width: 220px; height: 220px; border-radius: 52px; display: grid; place-items: center; }
  .icon img { width: 150px; }
  .label { font-size: 15px; letter-spacing: .2em; text-transform: uppercase; color: #6b5e52; font-weight: 600; }
</style>
</head>
<body>
  <div class="label">Logo · on white</div>
  <div class="panel white" id="light">
    <div class="lockup"><img src="logo.svg" alt="Kabuor Dine" /></div>
  </div>
  <div class="label">Logo · on espresso</div>
  <div class="panel ink" id="dark">
    <div class="lockup"><img src="logo-on-dark.svg" alt="Kabuor Dine" /></div>
  </div>
  <div class="label">Profile / app icon</div>
  <div class="icons">
    <div class="icon cream" id="icon-light"><img src="mark.svg" alt="" /></div>
    <div class="icon ink" id="icon-dark"><img src="mark-on-dark.svg" alt="" /></div>
  </div>
</body>
</html>
